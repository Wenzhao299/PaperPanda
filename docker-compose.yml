# ============================================================
# PaperPanda - 基础设施 Docker Compose
# 仅启动数据库等基础设施服务，前后端代码直接运行
# 数据目录统一落在 /data/home/wls_cwz/data/paperpanda/*
# ============================================================

services:
  # PostgreSQL 关系数据库
  postgres:
    image: postgres:16-alpine
    container_name: paperpanda-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paperpanda
      POSTGRES_PASSWORD: paperpanda_secret
      POSTGRES_DB: paperpanda
    volumes:
      - /data/home/wls_cwz/data/paperpanda/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperpanda"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存 & 消息队列
  redis:
    image: redis:7-alpine
    container_name: paperpanda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /data/home/wls_cwz/data/paperpanda/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus 向量数据库 - etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: paperpanda-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - /data/home/wls_cwz/data/paperpanda/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量数据库 - MinIO
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: paperpanda-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - /data/home/wls_cwz/data/paperpanda/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量数据库 - Standalone
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: paperpanda-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - /data/home/wls_cwz/data/paperpanda/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Meilisearch 全文搜索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: paperpanda-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: paperpanda_meili_key
      MEILI_ENV: development
    volumes:
      - /data/home/wls_cwz/data/paperpanda/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 3
